name: ACP Issue Bridge — Public Issue Created

# Responsibility (spec sections 8/9/56): validate, deduplicate, sanitize,
# and create the correlated private engineering mirror. Public -> private is
# automatic; this workflow never writes back to this (public) repository.

on:
  issues:
    types:
      - opened

permissions:
  contents: read

concurrency:
  group: acp-issue-bridge-public-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  mirror-to-private:
    name: mirror-to-private
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Mint ACP Issue Bridge installation token (private repo only)
        id: bridge-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ACP_ISSUE_BRIDGE_APP_ID }}
          private-key: ${{ secrets.ACP_ISSUE_BRIDGE_PRIVATE_KEY }}
          repositories: arrakis-control-panel
          permission-issues: write
          permission-metadata: read

      - name: Mirror public issue into the private engineering repo
        env:
          ACP_BRIDGE_TOKEN: ${{ steps.bridge-token.outputs.token }}
          ACP_BRIDGE_BOT_LOGIN: ${{ steps.bridge-token.outputs.app-slug }}[bot]
        run: node .github/scripts/issue-bridge/public-issue-opened.mjs
