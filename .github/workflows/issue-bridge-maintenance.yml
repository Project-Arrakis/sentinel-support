name: ACP Issue Bridge — Maintenance (public)

# Responsibility (spec section 55/75): keep the public label taxonomy
# bootstrapped and publish this repo's config checksum so the private repo
# can detect configuration drift without either side needing `contents:read`
# on the other's repository.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *" # daily
  push:
    branches:
      - main
    paths:
      - ".github/acp-issue-bridge.yml"
      - ".github/scripts/issue-bridge/**"

permissions:
  contents: read
  issues: write

jobs:
  bootstrap-and-publish:
    name: bootstrap-and-publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Bootstrap public labels (own repo, native token)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/issue-bridge/maintenance-bootstrap-labels.mjs public

      - name: Publish this repo's config checksum (own repo, native token)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/issue-bridge/maintenance-config-drift.mjs publish
