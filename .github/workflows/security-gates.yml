name: Security Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  # Both jobs used to reimplement gitleaks/semgrep inline -- secret-scan
  # via gitleaks/gitleaks-action, which started requiring a paid
  # org-account license this session. Both now call the org-shared
  # reusable-security-scan.yml (raw gitleaks CLI, sidesteps the license
  # requirement entirely) instead, so a fix lands once in .github and
  # every caller gets it.
  semgrep-sast:
    uses: Project-Arrakis/.github/.github/workflows/reusable-security-scan.yml@main
    with:
      run-gitleaks: false
      run-trivy: false
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  secret-scan:
    uses: Project-Arrakis/.github/.github/workflows/reusable-security-scan.yml@main
    with:
      run-semgrep: false
      run-trivy: false
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
